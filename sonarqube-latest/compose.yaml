---
x-storage-env: &storage-env
  SONAR_AGENTIC_STORAGE_TYPE: FILESYSTEM
  SONAR_AGENTIC_STORAGE_FILESYSTEM_BASE_DIR: /agentic-storage
  SONAR_AGENTIC_STORAGE_PATH_STYLE_ACCESS: "true"
  SONAR_AGENTIC_STORAGE_PRESIGN_TTL_SECONDS: "21600"

x-job-storage-env: &job-storage-env
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_TYPE: FILESYSTEM
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_FILESYSTEM_BASE_DIR: /agentic-storage
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_PATH_STYLE_ACCESS: "true"
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_PRESIGN_TTL_SECONDS: "21600"

services:
  sonarqube-latest-mcp:
    container_name: sonarqube-latest-mcp
    depends_on:
      - sonarqube-latest
    image: mcp/sonarqube:latest
    restart: unless-stopped
    environment:
      SONARQUBE_HTTP_HOST: 0.0.0.0
      SONARQUBE_HTTP_PORT: 8080
      SONARQUBE_TOKEN: ${SONAR_TOKEN}
      SONARQUBE_TRANSPORT: http
      SONARQUBE_URL: http://sonarqube-latest:9000
    networks:
      - sonarqube-latest-backend
    ports:
      - 19999:8080

  sonarqube-latest:
    container_name: sonarqube-latest
    depends_on:
      sonarqube-latest-openldap:
        condition: service_started
      sonarqube-latest-postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully
    image: sonarqube:2026.5.6-enterprise
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-latest-postgres/sonarqube?currentSchema=public
      - SONAR_JDBC_USERNAME=sonar

      # LDAP config

      # - SONAR_SECURITY_REALM=LDAP
      - LDAP_URL=ldap://sonarqube-latest-openldap:389
      - LDAP_BINDDN=cn=admin,dc=example,dc=org
      - LDAP_REALM=example.org

      # [LDAP] anchor mapping

      - LDAP_USER_BASEDN=cn=employees,dc=example,dc=org
      - LDAP_USER_REQUEST=(&(objectClass=inetOrgPerson)(uid={login}))

      # [LDAP] group mapping

      - LDAP_GROUP_BASEDN=dc=example,dc=org
      - LDAP_GROUP_REQUEST=(&(objectClass=groupofUniqueNames)(uniqueMember={dn}))
      - LDAP_GROUP_IDATTRIBUTE=cn
    stop_grace_period: 3600s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - sonarqube-latest-backend
      - control
      - proxy-target
    volumes:
      - agentic-storage:/agentic-storage
      - agentic_signing_sqs:/run/agentic-signing:ro
      - ./conf:/opt/sonarqube/conf
      - ./data:/opt/sonarqube/data
      - ./extensions:/opt/sonarqube/extensions
      # - ./lib/extensions:/opt/sonarqube/lib/extensions
      - ./logs:/opt/sonarqube/logs

  sonarqube-latest-openldap:
    container_name: sonarqube-latest-openldap
    image: osixia/openldap:1.5.0
    networks:
      - sonarqube-latest-backend

  sonarqube-latest-phpldapadmin:
    container_name: sonarqube-latest-phpldadmin
    depends_on:
      - sonarqube-latest-openldap
    image: osixia/phpldapadmin:0.9.0
    ports:
      - 19998:443  # https://localhost:19998
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=sonarqube-latest-openldap
    networks:
      - sonarqube-latest-backend
      - sonarqube-latest-frontend

  sonarqube-latest-postgres:
    container_name: sonarqube-latest-postgres
    image: postgres:18
    environment:
      - POSTGRES_DB=sonarqube
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sonarqube-latest-backend
    volumes:
      - var-lib-postgresql-18-docker:/var/lib/postgresql/18/docker

  sonarqube-latest-nginx:
    container_name: sonarqube-latest-nginx
    depends_on:
      - sonarqube-latest
    image: nginx:1.29
    networks:
      - sonarqube-latest-backend
      - sonarqube-latest-frontend
    ports:
      - 19995:80
      - 19996:81
      - 19997:443
    volumes:
      - ./server.crt:/etc/nginx/ssl/certificate.crt
      - ./server.key:/etc/nginx/ssl/private.key
      - ./nginx.conf:/etc/nginx/nginx.conf

  # sonarqube-latest-vmagent:
  #   container_name: sonarqube-latest-vmagent
  #   depends_on:
  #     - sonarqube-latest
  #   image: victoriametrics/vmagent:v1.93.15
  #   networks:
  #     - sonarqube-latest-backend
  #   command:
  #     - "--promscrape.config=/etc/prometheus/prometheus.yml"
  #     - "--remoteWrite.url=http://host.docker.internal:8428/api/v1/write"
  #   volumes:
  #     - ./vmagent.yaml:/etc/prometheus/prometheus.yml
  #     - vmagentdata:/vmagentdata

  # ---------------------------------------------------------------------------
  # Agentic pack (hunter, remediation, vortex), adapted from ./enterprise/.
  # Requires AGENTIC_SIGNING_SECRET (>= 32 chars: `openssl rand -hex 32`) in the environment/.env.
  # The agent runtimes run on the Podman machine default OCI runtime (crun), without the gVisor sandbox
  # the upstream pack uses (`runtime: runsc`). `podman create` on macOS has no --runtime flag.
  # ---------------------------------------------------------------------------

  storage-init:
    image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    working_dir: /agentic-storage
    command: ["sh", "-c", "mkdir -p hunter remediation && chmod 1777 . hunter remediation"]
    volumes:
      - agentic-storage:/agentic-storage
    networks: [sonarqube-latest-backend]

  signing-init:
    image: sonarsource/sonarqube-agent-orchestrator:2026.5.2
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        [ $${#AGENTIC_SIGNING_SECRET} -ge 32 ] ||
          { echo "AGENTIC_SIGNING_SECRET is shorter than 32 characters; use: openssl rand -hex 32" >&2; exit 1; }
        printf '%s' "$$AGENTIC_SIGNING_SECRET" > /tmp/instance-secret
        cp /tmp/instance-secret /run/agentic-signing/sqs/instance-secret
        /derive-keys.sh --secret-file /tmp/instance-secret \
          --label agentic-shared=/run/agentic-signing/sqs/agentic-shared.key \
          --label agentic-shared=/run/agentic-signing/orchestrator/agentic-shared.key \
          --label orchestrator-job-capability=/run/agentic-signing/orchestrator/orchestrator-job-capability.key \
          --label hunter-to-orchestrator=/run/agentic-signing/orchestrator/hunter-to-orchestrator.key \
          --label remediation-to-orchestrator=/run/agentic-signing/orchestrator/remediation-to-orchestrator.key \
          --label orchestrator-to-hunter=/run/agentic-signing/orchestrator/orchestrator-to-hunter.key \
          --label orchestrator-to-hunter=/run/agentic-signing/hunter/orchestrator-to-hunter.key \
          --label hunter-to-orchestrator=/run/agentic-signing/hunter/hunter-to-orchestrator.key \
          --label orchestrator-to-remediation=/run/agentic-signing/orchestrator/orchestrator-to-remediation.key \
          --label orchestrator-to-remediation=/run/agentic-signing/remediation/orchestrator-to-remediation.key \
          --label remediation-to-orchestrator=/run/agentic-signing/remediation/remediation-to-orchestrator.key \
          --label remediation-to-sqs=/run/agentic-signing/remediation/remediation-to-sqs.key \
          --label agentic-shared=/run/agentic-signing/vortex/agentic-shared.key
    environment:
      AGENTIC_SIGNING_SECRET: ${AGENTIC_SIGNING_SECRET:?set AGENTIC_SIGNING_SECRET, e.g. openssl rand -hex 32}
    volumes:
      - agentic_signing_sqs:/run/agentic-signing/sqs
      - agentic_signing_orchestrator:/run/agentic-signing/orchestrator
      - agentic_signing_hunter:/run/agentic-signing/hunter
      - agentic_signing_remediation:/run/agentic-signing/remediation
      - agentic_signing_vortex:/run/agentic-signing/vortex

  orchestrator:
    image: sonarsource/sonarqube-agent-orchestrator:2026.5.2
    stop_grace_period: 2580s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024M
    cpus: 1
    volumes:
      - orchestrator_tmp:/tmp
      - agentic_signing_orchestrator:/run/agentic-signing:ro
      - agentic-storage:/agentic-storage
    environment:
      <<: *job-storage-env
      # Must outlive the longest job (Hunter's 44400s deadline).
      SONAR_AGENTIC_ORCHESTRATOR_STORAGE_PRESIGN_TTL_SECONDS: "45000"
      AGENTIC_DISPATCHER_MAX_EXTRACTED_REPO_SIZE: "${AGENTIC_DISPATCHER_MAX_EXTRACTED_REPO_SIZE-1000000000}"
      AGENTIC_DISPATCHER_MAX_EXTRACTED_REPO_MEMBERS: "${AGENTIC_DISPATCHER_MAX_EXTRACTED_REPO_MEMBERS-100000}"
      SERVER_PORT: "8080"
      CORE_DB_READ_WRITE_ENDPOINT: sonarqube-latest-postgres:5432
      CORE_DB_NAME: sonarqube
      CORE_DB_USERNAME: sonar
      CORE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      AGENTIC_SONARQUBE_URL: http://sonarqube-latest:9000
      AGENTIC_SONARQUBE_SIGNING_KEY_PATH: /run/agentic-signing/agentic-shared.key
      AGENTIC_GITHUB_API_BASE_URL: https://api.github.com
      AGENTIC_HUNTER_RUNTIME_PUSH_URL: http://hunter-runtime:8090/jobs
      AGENTIC_HUNTER_RUNTIME_SIGNING_KEY_PATH: /run/agentic-signing/orchestrator-to-hunter.key
      AGENTIC_REMEDIATION_RUNTIME_PUSH_URL: http://remediation-agent-runtime:8090/jobs
      AGENTIC_REMEDIATION_RUNTIME_SIGNING_KEY_PATH: /run/agentic-signing/orchestrator-to-remediation.key
      AGENTIC_INBOUND_HUNTER_VERIFICATION_KEY_PATH: /run/agentic-signing/hunter-to-orchestrator.key
      AGENTIC_INBOUND_REMEDIATION_VERIFICATION_KEY_PATH: /run/agentic-signing/remediation-to-orchestrator.key
      AGENTIC_INBOUND_VERIFICATION_KEY_PATH: /run/agentic-signing/agentic-shared.key
      AGENTIC_JOB_CAPABILITY_SIGNING_KEY_PATH: /run/agentic-signing/orchestrator-job-capability.key
    depends_on:
      sonarqube-latest-postgres:
        condition: service_healthy
      sonarqube-latest:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully
    networks: [control, sonarqube-latest-backend, hunter-jobnet, remediation-jobnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  hunter-runtime:
    image: sonarsource/sonarqube-hunter-agent:2026.5.2
    pids_limit: 512
    stop_grace_period: 44430s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 8192M
    cpus: 2
    volumes:
      - agentic_signing_hunter:/run/agentic-signing:ro
      - type: volume
        source: agentic-storage
        target: /agentic-storage/hunter
        volume:
          subpath: hunter
    environment:
      SCRIPT_PATH: /home/agent/app/.venv/bin/detection-agent
      PLAYBOOK_KEY: appsec
      PLAYBOOK_VERSION: stable
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
      https_proxy: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      no_proxy: localhost,127.0.0.1
      AGENTIC_VERIFY_KEY_ID: orchestrator-to-hunter
      AGENTIC_VERIFY_KEY_PATH: /run/agentic-signing/orchestrator-to-hunter.key
      AGENT_ORCHESTRATOR_URL: http://orchestrator:8080
      AGENT_ORCHESTRATOR_SIGNING_KEY_PATH: /run/agentic-signing/hunter-to-orchestrator.key
    depends_on:
      egress-proxy:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully
    networks: [hunter-jobnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  remediation-agent-runtime:
    image: sonarsource/sonarqube-remediation-agent:2026.5.1
    pids_limit: 512
    stop_grace_period: 3630s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 8192M
    cpus: 4
    volumes:
      - agentic_signing_remediation:/run/agentic-signing:ro
      - type: volume
        source: agentic-storage
        target: /agentic-storage/remediation
        volume:
          subpath: remediation
    environment:
      REMEDIATION_SCRIPT_PATH: /home/agent/app/.venv/lib/python3.13/site-packages/remediation_agent/main.py
      HTTPS_PROXY: http://egress-proxy:3129
      HTTP_PROXY: http://egress-proxy:3129
      NO_PROXY: localhost,127.0.0.1
      https_proxy: http://egress-proxy:3129
      http_proxy: http://egress-proxy:3129
      no_proxy: localhost,127.0.0.1
      REMEDIATION_RULE_INFO_ENDPOINT: http://sonarqube-latest:9000/api/rules/show
      REMEDIATION_ANALYSIS_ENDPOINT: http://sonarqube-latest:9000/api/v2/a3s/private/analyses
      REMEDIATION_AGENTIC_SIGNING_KEY_PATH: /run/agentic-signing/remediation-to-sqs.key
      AGENTIC_VERIFY_KEY_ID: orchestrator-to-remediation
      AGENTIC_VERIFY_KEY_PATH: /run/agentic-signing/orchestrator-to-remediation.key
      AGENT_ORCHESTRATOR_URL: http://orchestrator:8080
      AGENT_ORCHESTRATOR_SIGNING_KEY_PATH: /run/agentic-signing/remediation-to-orchestrator.key
    depends_on:
      egress-proxy:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully
    networks: [remediation-jobnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  egress-proxy:
    image: ubuntu/squid:7.2-26.04_edge@sha256:d11db6479501aa4618b3253f95a88b2547229e2d081726b6fb20dc75a98cc61b
    entrypoint: ["/bin/sh", "/usr/local/bin/render-and-run.sh"]
    user: "13:13"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128M
    cpus: 0.25
    environment:
      AGENTIC_LLM_ALLOWED_DOMAINS: ${AGENTIC_LLM_ALLOWED_DOMAINS:-api.anthropic.com}
      AGENTIC_STORAGE_ALLOWED_DOMAIN:
      AGENTIC_STORAGE_ALLOWED_PORT: ""
      AGENTIC_SQS_PROXY_SCHEME: http
      AGENTIC_SQS_PROXY_HOST: sonarqube-latest
      AGENTIC_SQS_PROXY_PORT: 9000
      AGENTIC_ORCHESTRATOR_PROXY_HOST: orchestrator
      AGENTIC_ORCHESTRATOR_PROXY_PORT: "8080"
    volumes:
      - ./enterprise/egress-proxy/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./enterprise/egress-proxy/entrypoint.sh:/usr/local/bin/render-and-run.sh:ro
    networks: [hunter-jobnet, remediation-jobnet, egress, proxy-target]
    healthcheck:
      test: ["CMD", "perl", "-MIO::Socket::INET", "-e", "IO::Socket::INET->new(PeerAddr => '127.0.0.1:3128', Timeout => 2) or exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  vortex:
    image: sonarsource/sonar-vortex:2026.5.1
    stop_grace_period: 180s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 8192M
    cpus: 2
    volumes:
      - agentic_signing_vortex:/run/agentic-signing:ro
      - agentic-storage:/agentic-storage:ro
    environment:
      <<: *storage-env
      VORTEX_ANALYSIS_SONARQUBE_URL: http://sonarqube-latest:9000
      AGENTIC_ORCHESTRATOR_SIGNING_KEY_PATH: /run/agentic-signing/agentic-shared.key
    depends_on:
      sonarqube-latest:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully
    networks: [control]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s

networks:
  sonarqube-latest-backend:
  sonarqube-latest-frontend:
  # SonarQube, orchestrator, Vortex; orchestrator's outbound git/DevOps traffic.
  control:
  # Agent runtimes' only path out, via the egress proxy allowlist.
  egress:
  # One per runtime so the two can't reach each other.
  hunter-jobnet:
    internal: true
  remediation-jobnet:
    internal: true
  # egress-proxy's route to SonarQube.
  proxy-target:
    internal: true

volumes:
  var-lib-postgresql-18-docker:
  agentic-storage:
  orchestrator_tmp:
  agentic_signing_sqs:
  agentic_signing_orchestrator:
  agentic_signing_hunter:
  agentic_signing_remediation:
  agentic_signing_vortex:
  # vmagentdata:

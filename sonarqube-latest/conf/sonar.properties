sonar.issues.sandbox.enabled=true
sonar.issues.sandbox.default=true
sonar.issues.sandbox.override.enabled=true
sonar.issues.sandbox.software-qualities=[{"softwareQuality":"MAINTAINABILITY", "impactSeverities":["LOW","INFO"]}]

sonar.log.level=DEBUG

sonar.multi-quality-mode.enabled=false

sonar.search.host=0.0.0.0

sonar.secretKeyPath=conf/sonar-secret.txt

sonar.updatecenter.activate=false

sonar.web.accessLogs.pattern=%h %l %reqAttribute{LOGIN} [%t] '%r' %s %b '%i{Referer}' '%i{User-Agent}' '%reqAttribute{ID}'
sonar.web.systemPasscode={aes-gcm}MEMhXLqAn1S5xqtnvx+lF5qFxYbceinEGXoACgNezeAuEA==

# --- Agentic pack (hunter, remediation, vortex); see ./compose.yaml ---
sonar.core.serverBaseURL=https://sonarqube-latest.waynekhan.local:19997

sonar.hunteragent.orchestrator.url=http://orchestrator:8080
sonar.remediationagent.orchestrator.url=http://orchestrator:8080

sonar.vortex.enabled=true
sonar.vortex.analysis.url=http://vortex:8080

sonar.agentic.storage.type=FILESYSTEM
sonar.agentic.storage.filesystem.base-dir=/agentic-storage
sonar.agentic.storage.path-style-access=true
sonar.agentic.storage.presign-ttl-seconds=21600

sonar.agentic.orchestrator.storage.type=FILESYSTEM
sonar.agentic.orchestrator.storage.filesystem.base-dir=/agentic-storage
sonar.agentic.orchestrator.storage.path-style-access=true
sonar.agentic.orchestrator.storage.presign-ttl-seconds=21600

sonar.agents.health.checkIntervalSeconds=10

sonar.agentic.signing.secretFile=/run/agentic-signing/instance-secret
sonar.agentic.orchestrator.signingKeyPath=/run/agentic-signing/agentic-shared.key

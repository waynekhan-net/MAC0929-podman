# Generated by agentic-compose-generator/generate.py — do not hand-edit; regenerate instead.
name: agentic-enterprise


x-context-storage-env: &context-storage-env
  SONAR_AGENTIC_STORAGE_TYPE: FILESYSTEM
  SONAR_AGENTIC_STORAGE_FILESYSTEM_BASE_DIR: ${AGENTIC_STORAGE_MOUNT:-/agentic-storage}
  SONAR_AGENTIC_STORAGE_BUCKET: ${AGENTIC_STORAGE_BUCKET:-}
  SONAR_AGENTIC_STORAGE_REGION: ${AGENTIC_STORAGE_REGION:-}
  SONAR_AGENTIC_STORAGE_ENDPOINT: ${AGENTIC_STORAGE_ENDPOINT:-}
  SONAR_AGENTIC_STORAGE_ACCESS_KEY: ${AGENTIC_STORAGE_ACCESS_KEY:-}
  SONAR_AGENTIC_STORAGE_SECRET_KEY: ${AGENTIC_STORAGE_SECRET_KEY:-}
  SONAR_AGENTIC_STORAGE_PATH_STYLE_ACCESS: ${AGENTIC_STORAGE_PATH_STYLE_ACCESS:-true}
  SONAR_AGENTIC_STORAGE_PRESIGN_TTL_SECONDS: ${AGENTIC_STORAGE_PRESIGN_TTL_SECONDS:-21600}

x-job-storage-env: &job-storage-env
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_TYPE: FILESYSTEM
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_FILESYSTEM_BASE_DIR: ${AGENTIC_STORAGE_MOUNT:-/agentic-storage}
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_BUCKET: ${AGENTIC_STORAGE_BUCKET:-}
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_REGION: ${AGENTIC_STORAGE_REGION:-}
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_ENDPOINT: ${AGENTIC_STORAGE_ENDPOINT:-}
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_ACCESS_KEY: ${AGENTIC_STORAGE_ACCESS_KEY:-}
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_SECRET_KEY: ${AGENTIC_STORAGE_SECRET_KEY:-}
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_PATH_STYLE_ACCESS: ${AGENTIC_STORAGE_PATH_STYLE_ACCESS:-true}
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_PRESIGN_TTL_SECONDS: ${AGENTIC_STORAGE_PRESIGN_TTL_SECONDS:-21600}


networks:
  # Routable: SonarQube, orchestrator, Vortex, and the orchestrator's outbound git/DevOps traffic.
  control:
  # The agent runtimes' only path to the LLM APIs and to SonarQube, via the egress proxy's allowlist.
  egress:
  # Database only, no route off-box.
  data:
    internal: true
  # One per runtime: the orchestrator's job dispatch to it, and its route to egress-proxy. Separate
  # so the two runtimes can't reach each other. SonarQube is on neither.
  hunter-jobnet:
    internal: true
  remediation-jobnet:
    internal: true
  # egress-proxy's route to SonarQube for the remediation runtime's rule-info/analysis calls.
  proxy-target:
    internal: true
  # tls-proxy's/agentic-proxy's route to the backing services and the host's published port.
  edge:


volumes:
  pgdata:
  agentic-storage:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  agentic_signing_sqs:
  orchestrator_tmp:
  agentic_signing_orchestrator:
  agentic_signing_hunter:
  agentic_signing_remediation:
  agentic_signing_vortex:
  tls_certs:

services:
  storage-init:
    image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    # One subdirectory per runtime, which mounts only its own; see the runtimes' storage mounts.
    working_dir: ${AGENTIC_STORAGE_MOUNT:-/agentic-storage}
    command: ["sh", "-c", "mkdir -p hunter remediation && chmod 1777 . hunter remediation"]
    volumes:
      - ${AGENTIC_STORAGE_SOURCE:-agentic-storage}:${AGENTIC_STORAGE_MOUNT:-/agentic-storage}
    networks: [data]

  signing-init:
    image: sonarsource/sonarqube-agent-orchestrator:2026.5.2
    user: "0:0"
    # Root only to own the key volumes it creates; it needs no capability on top of that.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        [ $${#AGENTIC_SIGNING_SECRET} -ge 32 ] ||
          { echo "AGENTIC_SIGNING_SECRET is shorter than 32 characters — SonarQube requires at" \
            "least that many bytes and disables verification on a shorter one, silently. Use:" \
            "openssl rand -hex 32" >&2; exit 1; }
        printf '%s' "$$AGENTIC_SIGNING_SECRET" > /tmp/instance-secret
        cp /tmp/instance-secret /run/agentic-signing/sqs/instance-secret
        /derive-keys.sh --secret-file /tmp/instance-secret \
          --label agentic-shared=/run/agentic-signing/sqs/agentic-shared.key \
          --label agentic-shared=/run/agentic-signing/orchestrator/agentic-shared.key \
          --label orchestrator-job-capability=/run/agentic-signing/orchestrator/orchestrator-job-capability.key \
          --label hunter-to-orchestrator=/run/agentic-signing/orchestrator/hunter-to-orchestrator.key \
          --label remediation-to-orchestrator=/run/agentic-signing/orchestrator/remediation-to-orchestrator.key \
          --label orchestrator-to-hunter=/run/agentic-signing/orchestrator/orchestrator-to-hunter.key \
          --label orchestrator-to-hunter=/run/agentic-signing/hunter/orchestrator-to-hunter.key \
          --label hunter-to-orchestrator=/run/agentic-signing/hunter/hunter-to-orchestrator.key \
          --label orchestrator-to-remediation=/run/agentic-signing/orchestrator/orchestrator-to-remediation.key \
          --label orchestrator-to-remediation=/run/agentic-signing/remediation/orchestrator-to-remediation.key \
          --label remediation-to-orchestrator=/run/agentic-signing/remediation/remediation-to-orchestrator.key \
          --label remediation-to-sqs=/run/agentic-signing/remediation/remediation-to-sqs.key \
          --label agentic-shared=/run/agentic-signing/vortex/agentic-shared.key
    environment:
      AGENTIC_SIGNING_SECRET: ${AGENTIC_SIGNING_SECRET:?set AGENTIC_SIGNING_SECRET in .env, see README}
    volumes:
      - agentic_signing_sqs:/run/agentic-signing/sqs
      - agentic_signing_orchestrator:/run/agentic-signing/orchestrator
      - agentic_signing_hunter:/run/agentic-signing/hunter
      - agentic_signing_remediation:/run/agentic-signing/remediation
      - agentic_signing_vortex:/run/agentic-signing/vortex

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:2026.5.4-enterprise
    volumes:
      - ./sonarqube/sonar.properties:/opt/sonarqube/conf/sonar.properties:ro
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - agentic_signing_sqs:/run/agentic-signing:ro
      - ${AGENTIC_STORAGE_SOURCE:-agentic-storage}:${AGENTIC_STORAGE_MOUNT:-/agentic-storage}
    environment:
      <<: [*context-storage-env, *job-storage-env]
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
      SONAR_AGENTIC_SIGNING_SECRETFILE: /run/agentic-signing/instance-secret
      SONAR_AGENTIC_ORCHESTRATOR_SIGNINGKEYPATH: /run/agentic-signing/agentic-shared.key
      SONAR_CORE_SERVERBASEURL: https://${TLS_SERVER_NAME:-localhost}:${SONARQUBE_TLS_PUBLISH_PORT:-9443}
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully
    ports: []  # published by tls-proxy instead
    networks: [control, data, proxy-target, edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  orchestrator:
    image: sonarsource/sonarqube-agent-orchestrator:2026.5.2
    # Covers the graceful web drain plus the two db-scheduler shutdown phases (5m + 15m) after it.
    stop_grace_period: 2580s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024M
    cpus: 1
    volumes:
      - orchestrator_tmp:/tmp
      - agentic_signing_orchestrator:/run/agentic-signing:ro
      - ${AGENTIC_STORAGE_SOURCE:-agentic-storage}:${AGENTIC_STORAGE_MOUNT:-/agentic-storage}
    environment:
      <<: *job-storage-env
      AGENTIC_DISPATCHER_MAX_EXTRACTED_REPO_SIZE: "${AGENTIC_DISPATCHER_MAX_EXTRACTED_REPO_SIZE-1000000000}"
      AGENTIC_DISPATCHER_MAX_EXTRACTED_REPO_MEMBERS: "${AGENTIC_DISPATCHER_MAX_EXTRACTED_REPO_MEMBERS-100000}"
      # The URLs it presigns for a job must outlive the longest one (Hunter's 44400s deadline), so
      # it doesn't take AGENTIC_STORAGE_PRESIGN_TTL_SECONDS, which SonarQube and Vortex use.
      SONAR_AGENTIC_ORCHESTRATOR_STORAGE_PRESIGN_TTL_SECONDS: "45000"
      SERVER_PORT: "8080"
      CORE_DB_READ_WRITE_ENDPOINT: postgres:5432
      CORE_DB_NAME: sonarqube
      CORE_DB_USERNAME: sonarqube
      CORE_DB_PASSWORD: sonarqube
      AGENTIC_SONARQUBE_URL: http://sonarqube:9000
      AGENTIC_SONARQUBE_SIGNING_KEY_PATH: /run/agentic-signing/agentic-shared.key
      AGENTIC_GITHUB_API_BASE_URL: https://api.github.com
      AGENTIC_HUNTER_RUNTIME_PUSH_URL: http://hunter-runtime:8090/jobs
      AGENTIC_HUNTER_RUNTIME_SIGNING_KEY_PATH: /run/agentic-signing/orchestrator-to-hunter.key
      AGENTIC_REMEDIATION_RUNTIME_PUSH_URL: http://remediation-agent-runtime:8090/jobs
      AGENTIC_REMEDIATION_RUNTIME_SIGNING_KEY_PATH: /run/agentic-signing/orchestrator-to-remediation.key
      AGENTIC_INBOUND_HUNTER_VERIFICATION_KEY_PATH: /run/agentic-signing/hunter-to-orchestrator.key
      AGENTIC_INBOUND_REMEDIATION_VERIFICATION_KEY_PATH: /run/agentic-signing/remediation-to-orchestrator.key
      AGENTIC_INBOUND_VERIFICATION_KEY_PATH: /run/agentic-signing/agentic-shared.key
      AGENTIC_JOB_CAPABILITY_SIGNING_KEY_PATH: /run/agentic-signing/orchestrator-job-capability.key
    depends_on:
      postgres:
        condition: service_healthy
      sonarqube:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully

    ports: []  # internal only, SonarQube reaches it over the compose network
    networks: [control, data, hunter-jobnet, remediation-jobnet]
    healthcheck:
      # /readyz, as the Helm chart probes: /health aggregates the database and storage checks and
      # turns 503 for the whole drain on stop.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  hunter-runtime:
    image: sonarsource/sonarqube-hunter-agent:2026.5.2
    runtime: runsc
    pids_limit: 512
    # Just above the image's own 44400s graceful-shutdown wait for a running job, so a stop doesn't
    # kill it before that wait ends.
    stop_grace_period: 44430s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 8192M
    cpus: 2
    volumes:
      - agentic_signing_hunter:/run/agentic-signing:ro
      - type: volume
        source: agentic-storage
        target: ${AGENTIC_STORAGE_MOUNT:-/agentic-storage}/hunter
        volume:
          subpath: hunter
    environment:
      SCRIPT_PATH: /home/agent/app/.venv/bin/detection-agent
      PLAYBOOK_KEY: appsec
      PLAYBOOK_VERSION: stable
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
      # Some HTTP clients read only the lower-case names.
      https_proxy: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      no_proxy: localhost,127.0.0.1
      AGENTIC_VERIFY_KEY_ID: orchestrator-to-hunter
      AGENTIC_VERIFY_KEY_PATH: /run/agentic-signing/orchestrator-to-hunter.key
      AGENT_ORCHESTRATOR_URL: http://orchestrator:8080
      AGENT_ORCHESTRATOR_SIGNING_KEY_PATH: /run/agentic-signing/hunter-to-orchestrator.key
    depends_on:
      egress-proxy:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully
    networks: [hunter-jobnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  remediation-agent-runtime:
    image: sonarsource/sonarqube-remediation-agent:2026.5.1
    runtime: runsc
    pids_limit: 512
    # Just above the image's own 3600s graceful-shutdown wait for a running job, so a stop doesn't
    # kill it before that wait ends.
    stop_grace_period: 3630s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 8192M
    cpus: 4
    volumes:
      - agentic_signing_remediation:/run/agentic-signing:ro
      - type: volume
        source: agentic-storage
        target: ${AGENTIC_STORAGE_MOUNT:-/agentic-storage}/remediation
        volume:
          subpath: remediation
    environment:
      REMEDIATION_SCRIPT_PATH: /home/agent/app/.venv/lib/python3.13/site-packages/remediation_agent/main.py
      # egress-proxy's remediation-only listener: the one its SonarQube rules match on.
      HTTPS_PROXY: http://egress-proxy:3129
      HTTP_PROXY: http://egress-proxy:3129
      NO_PROXY: localhost,127.0.0.1
      # Some HTTP clients read only the lower-case names.
      https_proxy: http://egress-proxy:3129
      http_proxy: http://egress-proxy:3129
      no_proxy: localhost,127.0.0.1
      REMEDIATION_RULE_INFO_ENDPOINT: http://sonarqube:9000/api/rules/show
      REMEDIATION_ANALYSIS_ENDPOINT: http://sonarqube:9000/api/v2/a3s/private/analyses
      REMEDIATION_AGENTIC_SIGNING_KEY_PATH: /run/agentic-signing/remediation-to-sqs.key
      AGENTIC_VERIFY_KEY_ID: orchestrator-to-remediation
      AGENTIC_VERIFY_KEY_PATH: /run/agentic-signing/orchestrator-to-remediation.key
      AGENT_ORCHESTRATOR_URL: http://orchestrator:8080
      AGENT_ORCHESTRATOR_SIGNING_KEY_PATH: /run/agentic-signing/remediation-to-orchestrator.key
    depends_on:
      egress-proxy:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully

    networks: [remediation-jobnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  egress-proxy:
    image: ubuntu/squid:7.2-26.04_edge@sha256:d11db6479501aa4618b3253f95a88b2547229e2d081726b6fb20dc75a98cc61b
    entrypoint: ["/bin/sh", "/usr/local/bin/render-and-run.sh"]
    # The image's proxy user. The entrypoint renders squid.conf into /tmp and runs Squid in the
    # foreground, logging to stdout, so nothing else on the root filesystem needs to be writable.
    user: "13:13"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128M
    cpus: 0.25
    environment:
      AGENTIC_LLM_ALLOWED_DOMAINS: api.anthropic.com
      AGENTIC_STORAGE_ALLOWED_DOMAIN: 
      AGENTIC_STORAGE_ALLOWED_PORT: ""
      AGENTIC_SQS_PROXY_SCHEME: http
      AGENTIC_SQS_PROXY_HOST: sonarqube
      AGENTIC_SQS_PROXY_PORT: 9000
      AGENTIC_ORCHESTRATOR_PROXY_HOST: orchestrator
      AGENTIC_ORCHESTRATOR_PROXY_PORT: "8080"
    volumes:
      - ./egress-proxy/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./egress-proxy/entrypoint.sh:/usr/local/bin/render-and-run.sh:ro

    networks: [hunter-jobnet, remediation-jobnet, egress, proxy-target]
    healthcheck:
      # The image ships no curl, and the 7.x rocks no bash either; Perl is in both, and a TCP
      # connect is enough to see the listener is up.
      test: ["CMD", "perl", "-MIO::Socket::INET", "-e", "IO::Socket::INET->new(PeerAddr => '127.0.0.1:3128', Timeout => 2) or exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  vortex:
    image: sonarsource/sonar-vortex:2026.5.1
    # Lets in-flight analyses finish on a stop.
    stop_grace_period: 180s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 8192M
    cpus: 2
    volumes:
      - agentic_signing_vortex:/run/agentic-signing:ro
      - ${AGENTIC_STORAGE_SOURCE:-agentic-storage}:${AGENTIC_STORAGE_MOUNT:-/agentic-storage}:ro
    environment:
      <<: *context-storage-env
      VORTEX_ANALYSIS_SONARQUBE_URL: http://sonarqube:9000
      AGENTIC_ORCHESTRATOR_SIGNING_KEY_PATH: /run/agentic-signing/agentic-shared.key
    depends_on:
      sonarqube:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      signing-init:
        condition: service_completed_successfully

    ports: []  # internal only, SonarQube reaches it over the compose network
    networks: [control]
    healthcheck:
      # The Vortex image ships neither curl nor wget, so probe with bash's /dev/tcp instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s

  tls-proxy:
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    entrypoint: ["/bin/sh", "/usr/local/bin/render-and-run.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      TLS_TEMPLATE: sonarqube
      TLS_UPSTREAM_HOST: sonarqube
      TLS_UPSTREAM_PORT: "9000"
      TLS_SERVER_NAME: localhost
      TLS_HTTPS_PUBLIC_PORT: ${SONARQUBE_TLS_PUBLISH_PORT:-9443}
    volumes:
      - tls_certs:/tls
      - ./tls-proxy/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./tls-proxy/nginx.agentic.conf.template:/etc/nginx/nginx.agentic.conf.template:ro
      - ./tls-proxy/entrypoint.sh:/usr/local/bin/render-and-run.sh:ro
    ports:
      - "${SONARQUBE_TLS_PUBLISH_PORT:-9443}:8443"
    depends_on:
      sonarqube:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost:8443/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

